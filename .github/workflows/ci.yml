name: CI

# Changes to documentation alone don't build.
on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  # The release workflow runs the same checks and publishes the .vsix built here
  workflow_call:

# A new push to a pull request cancels its outdated run; runs on master and tags finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Draft pull requests do not build; "Ready for review" starts the run (with Windows and macOS)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [26.x]

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Bun installs and runs the scripts; Jest stays on Node, since Jest Runner is a Jest runner:
      # the unit tests run in Jest, and the e2e tests start real Jest and Vitest processes through
      # their node_modules/.bin shims (#!/usr/bin/env node), as the users' projects do
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: bun install --frozen-lockfile
      # Platform independent, so only once (also avoids CRLF checkouts on Windows)
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: bun run lint
      - name: Typecheck
        if: matrix.os == 'ubuntu-latest'
        run: bun run typecheck
      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: bun run test --coverage
      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        run: bun run test
      # Real Jest/Vitest processes and terminal shells, above all for Windows
      - name: Run end-to-end tests
        run: bun run test:e2e
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/master'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Builds with Vite, then vsce package --no-dependencies: the extension is bundled into
      # dist/extension.js, so no node_modules go into the .vsix (vsce would otherwise call npm list)
      - run: bun run package
      # Installable from a pull request; the release attaches it and publishes it
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: '*.vsix'
          if-no-files-found: error
